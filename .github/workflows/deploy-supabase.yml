name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo 'Missing SUPABASE_ACCESS_TOKEN secret' && exit 1)
          test -n "$SUPABASE_PROJECT_ID" || (echo 'Missing SUPABASE_PROJECT_ID secret' && exit 1)
          supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy secure login function
        run: supabase functions deploy secure-login --no-verify-jwt --yes

      - name: Deploy account provisioning function
        run: supabase functions deploy provision-user --no-verify-jwt --yes

      - name: Deploy administrator actions function
        run: supabase functions deploy admin-account-action --no-verify-jwt --yes

      - name: Deploy public school request function
        run: supabase functions deploy submit-school-request --no-verify-jwt --yes

      - name: Deploy public support ticket function
        run: supabase functions deploy submit-support-ticket --no-verify-jwt --yes

      - name: Deploy first-login password activation function
        run: supabase functions deploy complete-first-login --no-verify-jwt --yes
